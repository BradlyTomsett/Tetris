<style>
:root {
  color-scheme: dark;
  font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
  --ink: #080b16;
  --border: #293656;
  --text: #edf5ff;
  --muted: #9aaac6;
  --cyan: #7dece9;
  --violet: #c4b0ff;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --viewport-height: 100vh;
}

@supports (height: 100svh) {
  :root {
    --viewport-height: 100svh;
  }
}

*, *::before, *::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-width: 260px;
  min-height: 100vh;
  min-height: 100svh;
  color: var(--text);
  background-color: var(--ink);
  background-image:
    radial-gradient(ellipse at 50% 2%, #26335e 0%, transparent 46rem),
    radial-gradient(ellipse at 84% 86%, #231837 0%, transparent 32rem),
    radial-gradient(circle, #92a9f119 0.7px, transparent 0.9px);
  background-size: auto, auto, 18px 18px;
  background-attachment: fixed;
}

button {
  color: inherit;
  font: inherit;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  cursor: pointer;
  user-select: none;
}

button:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 3px;
}

button:disabled {
  cursor: default;
  opacity: 0.68;
}

[hidden] {
  display: none !important;
}

.game-shell {
  --pad-top: max(20px, env(safe-area-inset-top));
  --pad-bottom: max(14px, env(safe-area-inset-bottom));
  --board-size: clamp(132px, calc((var(--viewport-height) - 145px - var(--pad-top) - var(--pad-bottom)) / 2), 316px);
  --hud-size: clamp(68px, 20vw, 88px);
  --field-gap: 10px;
  width: min(100%, 450px);
  margin: 0 auto;
  padding: var(--pad-top) max(14px, env(safe-area-inset-right)) var(--pad-bottom) max(14px, env(safe-area-inset-left));
  display: grid;
  gap: 10px;
}

.masthead,
.brand {
  display: flex;
  align-items: center;
}

.masthead {
  min-width: 0;
  gap: 8px;
}

.brand {
  gap: 12px;
  min-width: 0;
}

.brand-mark {
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  width: 45px;
  height: 45px;
  border: 1px solid #4e7289;
  border-radius: 13px;
  background: linear-gradient(145deg, #254559, #1b263e 60%, #181c36);
  box-shadow: inset 0 1px #d7faff20, 0 3px 10px #070a1970;
  color: var(--cyan);
}

.brand-mark svg {
  display: block;
  width: 27px;
  height: 27px;
}

.eyebrow {
  display: block;
  margin: 0 0 3px;
  font: 700 10px/1 var(--mono);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--cyan);
}

.masthead h1 {
  margin: 0;
  font-size: clamp(24px, 6.4vw, 31px);
  line-height: 1.06;
  letter-spacing: 0.03em;
  white-space: nowrap;
}

.icon-button {
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: linear-gradient(155deg, #202c48, #121a2f);
  color: #d5e7fa;
}

.icon-button svg {
  display: block;
  width: 19px;
  height: 19px;
}

.settings-button {
  border-color: #396071;
  background: linear-gradient(155deg, #254150, #17243a);
  color: var(--cyan);
}

#pause-button {
  margin-inline-start: auto;
}

.side-hud {
  display: grid;
  align-content: start;
  gap: var(--field-gap);
  min-width: 0;
}

.stat-card,
.preview-card {
  min-width: 0;
  min-height: 66px;
  padding: 9px 6px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: linear-gradient(145deg, #1c2641, #121a30 75%);
  box-shadow: inset 0 1px #ffffff0a;
}

.stat-card {
  display: grid;
  align-content: center;
  gap: 6px;
  text-align: center;
}

.stat-label {
  display: block;
  color: #b3c0da;
  font-size: 11px;
  font-weight: 650;
  line-height: 1.1;
  letter-spacing: 0.09em;
}

.stat-value {
  display: block;
  color: var(--cyan);
  font: 750 clamp(17px, 5.5vw, 24px)/1.05 var(--mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.06em;
  overflow-wrap: anywhere;
}

.preview-card {
  display: grid;
  grid-template-rows: auto 1fr;
  justify-items: center;
  align-items: center;
  gap: 6px;
  background: linear-gradient(150deg, #222447, #151a32 75%);
  border-color: #3b3963;
}

#next-canvas {
  display: block;
  width: 100%;
  height: 32px;
  object-fit: contain;
}

.mode-switch {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 3px;
  padding: 3px;
  border: 1px solid #263351;
  border-radius: 11px;
  background: #10162a;
}

.mode-button {
  min-height: 44px;
  padding: 6px;
  border: 1px solid transparent;
  border-radius: 7px;
  color: #acbad6;
  background: transparent;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.03em;
}

.mode-button[aria-pressed="true"] {
  border-color: #3b6978;
  color: #bcfff9;
  background: linear-gradient(130deg, #204655, #23304d);
  box-shadow: 0 1px 5px #0005, inset 0 1px #ffffff0d;
}

.playfield {
  position: relative;
  display: grid;
  grid-template-columns: min(calc(100% - var(--hud-size) - var(--field-gap)), var(--board-size)) var(--hud-size);
  justify-content: center;
  align-items: start;
  gap: var(--field-gap);
  isolation: isolate;
}

.playfield::before {
  position: absolute;
  z-index: -1;
  inset: 2px 0;
  border: 1px solid #38456b46;
  border-radius: 16px;
  background:
    repeating-linear-gradient(0deg, #8395c508 0 1px, transparent 1px 7px),
    linear-gradient(90deg, #131b3080, #141e3c8a 45%, #141c3280);
  content: "";
}

.board-frame {
  position: relative;
  min-width: 0;
  padding: 4px;
  border: 1px solid #6476a6;
  border-radius: 10px;
  background: linear-gradient(150deg, #3e5482, #1a233d 46%, #333457);
  box-shadow: 0 0 0 3px #1a254490, 0 4px 18px #04061191, inset 0 1px #bed5ff27;
}

.board-frame::before,
.board-frame::after {
  position: absolute;
  z-index: 1;
  width: 20px;
  height: 2px;
  border-radius: 2px;
  pointer-events: none;
  content: "";
}

.board-frame::before {
  top: -1px;
  left: 9px;
  background: var(--cyan);
  box-shadow: 0 0 8px #84f3e887;
}

.board-frame::after {
  right: 9px;
  bottom: -1px;
  background: var(--violet);
  box-shadow: 0 0 8px #c4b0ff74;
}

#board {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 1 / 2;
  border-radius: 5px;
  background: #0a1021;
  touch-action: none;
}

.game-overlay {
  position: absolute;
  z-index: 2;
  inset: 5px;
  display: grid;
  place-items: center;
  border-radius: 5px;
  background: #090f21bb;
  text-align: center;
  overflow: hidden;
}

.overlay-card {
  width: calc(100% - 18px);
  max-width: 214px;
  padding: 16px 10px;
  border: 1px solid #50658e;
  border-radius: 11px;
  background: linear-gradient(146deg, #222e4b, #141c35 80%);
  box-shadow: 0 9px 22px #0305109e, inset 0 1px #ffffff16;
}

.overlay-tag {
  display: inline-block;
  margin: 0;
  color: var(--cyan);
  font: 700 9px/1.15 var(--mono);
  letter-spacing: 0.11em;
  text-transform: uppercase;
}

.overlay-card h2 {
  margin: 7px 0;
  font-size: clamp(18px, 5.4vw, 25px);
  line-height: 1.1;
}

.overlay-card p {
  margin: 0 auto 12px;
  color: #b5c4df;
  font-size: 12px;
  line-height: 1.5;
}

.primary-button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  width: 100%;
  min-height: 43px;
  padding: 6px 10px;
  border: 1px solid #b4fff4;
  border-radius: 8px;
  background: linear-gradient(120deg, #a2f9e8, #6fdfef);
  box-shadow: 0 3px #347d8f, 0 5px 12px #070c1f70;
  color: #10243b;
  font-size: 14px;
  font-weight: 800;
}

.primary-button svg {
  flex: 0 0 15px;
  width: 15px;
  height: 15px;
}

.secondary-button {
  width: 100%;
  min-height: 38px;
  margin-top: 7px;
  padding: 5px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: #c4d0e6;
  font-size: 12px;
  font-weight: 700;
}

.secondary-button:active {
  background: #263754;
}

.controls {
  display: grid;
  grid-template-columns: minmax(0, 3fr) minmax(64px, 1fr);
  gap: 14px;
}

.direction-controls { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; }
.controls.swapped { grid-template-columns:minmax(64px,1fr) minmax(0,3fr); }
.controls.swapped .direction-controls { order:2; }
.controls.swapped .control-rotate { order:1; }
.layout-switch { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.control-button {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-width: 0;
  min-height: 60px;
  padding: 5px 2px;
  border: 1px solid #4a5a81;
  border-radius: 11px;
  background: linear-gradient(154deg, #2a3657, #172039 80%);
  box-shadow: inset 0 1px #eef7ff16, 0 3px #10172a, 0 5px 7px #070b1680;
  color: #dfeaff;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.15;
  text-align: center;
  touch-action: none;
}

.control-button svg {
  display: block;
  width: 23px;
  height: 23px;
  pointer-events: none;
}

.control-button span {
  pointer-events: none;
}

.control-drop {
  color: #a7ffef;
  border-color: #477d81;
  background: linear-gradient(154deg, #255365, #1a2d48 82%);
}

.control-rotate {
  color: #e0d3ff;
  border-color: #675797;
  background: linear-gradient(154deg, #413768, #262347 82%);
}

.control-button:active:not(:disabled),
.primary-button:active:not(:disabled) {
  transform: translateY(2px);
  filter: brightness(1.18);
  box-shadow: inset 0 1px #eef7ff16, 0 1px #10172a;
}

.icon-button:active:not(:disabled) {
  background: #2b3b5c;
}

.game-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px 10px;
  padding: 1px 1px 0;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.2;
  letter-spacing: 0.08em;
}

#game-status::before {
  display: inline-block;
  width: 6px;
  height: 6px;
  margin-right: 6px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 7px #7dece975;
  vertical-align: 1px;
  content: "";
}

#level-status {
  color: var(--violet);
  font-variant-numeric: tabular-nums;
}

.settings-dialog {
  width: min(352px, calc(100% - 32px));
  max-height: calc(var(--viewport-height) - var(--pad-top) - var(--pad-bottom) - 16px);
  padding: 18px;
  overflow: auto;
  border: 1px solid #526692;
  border-radius: 16px;
  background: linear-gradient(155deg, #242f4d, #121a30 78%);
  box-shadow: 0 16px 48px #020611bb, inset 0 1px #ffffff18;
  color: var(--text);
}

.settings-dialog::backdrop {
  background: #070b19c7;
}

.settings-header,
.record-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.settings-header h2 {
  margin: 0;
  font-size: 24px;
  line-height: 1.15;
}

.settings-note {
  margin: 16px 0 8px;
  color: #bdcce5;
  font-size: 13px;
  line-height: 1.5;
}

#mode-help {
  min-height: 2em;
  margin-top: 8px;
}

.records {
  display: grid;
  gap: 7px;
  margin: 12px 0 15px;
}

.record-row {
  min-height: 42px;
  padding: 8px 10px;
  border: 1px solid #354269;
  border-radius: 8px;
  background: #1c2742;
}

.record-row .stat-label {
  flex: 0 0 auto;
  font-size: 12px;
}

.record-row .stat-value {
  text-align: end;
  color: var(--violet);
}

.settings-done {
  min-height: 44px;
}

.install-button {
  margin-top: 14px;
  border-color: #675797;
  color: #e0d3ff;
  background: linear-gradient(154deg, #413768, #262347 82%);
  box-shadow: 0 3px #18142f;
}
.install-help { margin: 9px 0 0; color: #bdcce5; font-size: 13px; line-height: 1.5; }

@media (hover: hover) and (pointer: fine) {
  .control-button:hover:not(:disabled),
  .icon-button:hover:not(:disabled),
  .primary-button:hover:not(:disabled) {
    filter: brightness(1.15);
  }

  .mode-button:hover:not(:disabled) {
    color: #e6fffc;
  }
}

@media (max-height: 720px) {
  .game-shell {
    --pad-top: max(12px, env(safe-area-inset-top));
    --pad-bottom: max(9px, env(safe-area-inset-bottom));
    --board-size: clamp(132px, calc((var(--viewport-height) - 126px - var(--pad-top) - var(--pad-bottom)) / 2), 316px);
    gap: 8px;
  }

  .control-button {
    min-height: 52px;
  }
}

@media (max-width: 330px) {
  .game-shell {
    --hud-size: 62px;
    --field-gap: 8px;
    padding-inline: max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-left));
  }

  .masthead,
  .brand {
    gap: 6px;
  }

  .brand-mark {
    width: 40px;
    height: 40px;
  }

  .controls {
    gap: 5px;
  }
}

</style>
</head>
<body>
  <main class="game-shell" aria-label="方块街机">
    <header class="masthead">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 36 36" fill="none">
            <rect x="5" y="7" width="8" height="8" rx="1.5" fill="#8a75ff"/>
            <rect x="14" y="7" width="8" height="8" rx="1.5" fill="#aa97ff"/>
            <rect x="23" y="7" width="8" height="8" rx="1.5" fill="#8a75ff"/>
            <rect x="14" y="16" width="8" height="8" rx="1.5" fill="#7557f3"/>
          </svg>
        </span>
        <div>
          <div class="eyebrow" aria-hidden="true">POCKET ARCADE</div>
          <h1>方块街机</h1>
        </div>
      </div>
      <button class="icon-button settings-button" id="settings-button" type="button" aria-label="设置" title="设置" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10 3h4l.6 2.7 2 .9 2.4-1.4 2 3.5-2 1.8v2.4l2 1.9-2 3.5-2.4-1.4-2 .9L14 21h-4l-.6-3.2-2-.9L5 18.3l-2-3.5 2-1.9v-2.4L3 8.7l2-3.5 2.4 1.4 2-.9z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
      <button class="icon-button" id="pause-button" type="button" aria-label="暂停" title="暂停" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="5" width="3.5" height="14" rx="1"/><rect x="13.5" y="5" width="3.5" height="14" rx="1"/></svg>
      </button>
    </header>

    <section class="playfield" aria-label="游戏区域">
      <div class="board-frame">
        <canvas id="board" width="300" height="600" role="img" aria-label="10 列 20 行的方块棋盘"></canvas>
        <div class="game-overlay" id="game-overlay">
          <div class="overlay-card">
            <span class="overlay-tag" id="overlay-tag">俄罗斯方块</span>
            <h2 id="overlay-title">准备就绪</h2>
            <p id="overlay-description">方块落下的速度始终相同。</p>
            <button class="primary-button" id="primary-action" type="button">
              <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M6 4.6a1 1 0 0 1 1.5-.9l8 5.4a1 1 0 0 1 0 1.8l-8 5.4a1 1 0 0 1-1.5-.9z"/></svg>
              <span id="action-text">开始游戏</span>
            </button>
            <button class="secondary-button" id="reset-button" type="button" hidden>结束本局</button>
          </div>
        </div>
      </div>
      <aside class="side-hud" aria-label="预告与分数">
        <div class="preview-card">
          <span class="stat-label">下一个</span>
          <canvas id="next-canvas" width="96" height="44" role="img" aria-label="下一个方块"></canvas>
        </div>
        <div class="stat-card">
          <span class="stat-label">当前分</span>
          <span class="stat-value" id="score">0</span>
        </div>
      </aside>
    </section>

    <section class="controls" aria-label="游戏操控">

    Z: [[0, 0], [1, 0], [1, 1], [2, 1]],
    M: [[1, 0]],

    D: [[0, 0], [1, 1], [2, 2]],

      this.mode = mode;
      this.random = random;
      this.board = Array.from({ length: HEIGHT }, emptyRow);

      this.score = 0;
      this.lines = 0;
      this.over = false;
      this.gravityProgress = 0;
      this.next = this.draw();

    }

      if (this.bag.length === 0) {
        this.bag = BAG.slice();
        for (let index = this.bag.length - 1; index > 0; index -= 1) {
          const other = Math.floor(this.random() * (index + 1));
          [this.bag[index], this.bag[other]] = [this.bag[other], this.bag[index]];

      }
      return this.bag.pop();

      this.over = !this.fits(this.active.x, this.active.y, this.active.cells);

      if (this.over || piece.type === "O" || piece.type === "M") return false;
      const box = ROTATION_BOX[piece.type] ?? 3;
      const cells = piece.cells.map(([x, y]) => [box - 1 - y, x]);
      if (!this.fits(piece.x, piece.y, cells)) return false;
      piece.cells = cells;
      return true;

      let y = piece.y;

      return y;

      const piece = this.active;
      if (!this.fits(piece.x, piece.y + 1, piece.cells)) return false;
      piece.y += 1;
      if (fast) this.score += 2;

      this.gravityProgress = 0;
      return true;

        this.lines += cleared;
        this.board = Array.from({ length: cleared }, emptyRow).concat(remaining);
      }
      this.spawn();
    }

    module.exports = engine;

(() => {
  "use strict";

  const { PIECES, WIDTH, HEIGHT } = TriangleEngine;
  const size = 60;
  const radius = 25;
  const sectors = 12;
  const directions = Array.from({ length: sectors }, (_, index) => {
    const angle = index * Math.PI / 6 - Math.PI / 2;
    return [Math.cos(angle), Math.sin(angle)];
  });
  const names = { E: "等边三角形", R: "等腰直角三角形", C: "270° 凹角拼片" };
  const colors = {
    E: ["#36d0e9", "#a5f2ff", "#178cae"],
    R: ["#ffb45f", "#ffe0a5", "#d07542"],
    C: ["#a68aff", "#e1d4ff", "#7551d7"],
  };

  function center(column, row) {
    return [(column + 0.5) * size, (row + 0.5) * size];
  }

  function vertices(type, rotation) {
    const span = PIECES[type].sectors;
    const points = [[0, 0]];
    const increment = type === "C" ? 3 : span;
    for (let offset = 0; offset <= span; offset += increment) {
      points.push(directions[(rotation + offset) % sectors]);
    }
    return points;
  }

  function drawPiece(ctx, type, rotation, x, y, scale, appearance) {
    const [face, light, dark] = colors[type];
    const [first, ...points] = vertices(type, rotation);
    ctx.beginPath();
    ctx.moveTo(x + first[0] * scale, y + first[1] * scale);
    for (const [dx, dy] of points) ctx.lineTo(x + dx * scale, y + dy * scale);
    ctx.closePath();

    if (appearance === "ghost") {
      ctx.fillStyle = `${face}19`;
      ctx.strokeStyle = `${face}a8`;
      ctx.lineWidth = 1.35;
      ctx.setLineDash([3, 2]);
      ctx.fill();
      ctx.stroke();
      ctx.setLineDash([]);
      return;
    }

    const fill = ctx.createLinearGradient(x - scale, y - scale, x + scale, y + scale);
    fill.addColorStop(0, light);
    fill.addColorStop(0.48, face);
    fill.addColorStop(1, dark);
    ctx.fillStyle = fill;
    ctx.strokeStyle = appearance === "active" ? light : `${light}8c`;
    ctx.lineWidth = appearance === "active" ? 1.35 : 0.9;
    ctx.lineJoin = "round";
    ctx.fill();
    ctx.stroke();
  }

  function drawGuides(ctx) {
    const background = ctx.createLinearGradient(0, 0, 0, HEIGHT * size);
    background.addColorStop(0, "#10182b");
    background.addColorStop(1, "#0a101f");
    ctx.fillStyle = background;
    ctx.fillRect(0, 0, WIDTH * size, HEIGHT * size);

    ctx.beginPath();
    for (let row = 0; row < HEIGHT; row += 1) {
      for (let column = 0; column < WIDTH; column += 1) {
        const [x, y] = center(column, row);
        ctx.moveTo(x + 27, y);
        ctx.arc(x, y, 27, 0, Math.PI * 2);
        for (const [dx, dy] of directions) {
          ctx.moveTo(x + dx * 23, y + dy * 23);
          ctx.lineTo(x + dx * 27, y + dy * 27);
        }
      }
    }
    ctx.strokeStyle = "#8cadf13a";
    ctx.lineWidth = 0.85;
    ctx.stroke();
  }

  function drawBoard(ctx, game, state) {
    ctx.save();
    drawGuides(ctx);

    for (let row = 0; row < HEIGHT; row += 1) {
      for (let column = 0; column < WIDTH; column += 1) {
        const [x, y] = center(column, row);
        for (const { type, rotation } of game.board[row][column]) {
          drawPiece(ctx, type, rotation, x, y, radius, "placed");
        }
      }
    }

    let waiting = null;
    if (game.active && (state === "playing" || state === "paused")) {
      const { type, rotation, x: column, y: row } = game.active;
      const landing = game.ghostY();
      if (landing >= 0 && landing > row) {
        drawPiece(ctx, type, rotation, ...center(column, landing), radius, "ghost");
      }
      if (row >= 0) {
        drawPiece(ctx, type, rotation, ...center(column, row), radius, "active");
      } else {
        waiting = { type, rotation, x: center(column, 0)[0] };
      }
    }

    ctx.beginPath();
    for (let row = 0; row < HEIGHT; row += 1) {
      for (let column = 0; column < WIDTH; column += 1) {
        const [x, y] = center(column, row);
        ctx.moveTo(x + 1.6, y);
        ctx.arc(x, y, 1.6, 0, Math.PI * 2);
      }
    }
    ctx.fillStyle = "#cfe4ff8c";
    ctx.fill();
    if (waiting) {
      ctx.fillStyle = "#172841";
      ctx.fillRect(waiting.x - 13, 1, 26, 22);
      ctx.strokeStyle = "#80a4cf";
      ctx.lineWidth = 1;
      ctx.strokeRect(waiting.x - 13, 1, 26, 22);
      drawPiece(ctx, waiting.type, waiting.rotation, waiting.x, 12, 8, "active");

    ctx.restore();
  }

    ctx.clearRect(0, 0, width, height);
    if (!type) return;
    const points = vertices(type, 0);
    const xs = points.map(([x]) => x);
    const ys = points.map(([, y]) => y);
    const left = Math.min(...xs);
    const right = Math.max(...xs);
    const top = Math.min(...ys);
    const bottom = Math.max(...ys);
    const scale = Math.min(25, (width - 6) / (right - left), (height - 6) / (bottom - top));
    const x = (width - (left + right) * scale) / 2;
    const y = (height - (top + bottom) * scale) / 2;
    ctx.save();
    drawPiece(ctx, type, 0, x, y, scale, "active");
    ctx.restore();
  }

  globalThis.TriangleView = { drawBoard, drawPreview, names };
})();

  function setupCanvas(canvas) {
    const context = canvas.getContext("2d");
    const scale = Math.min(3, Math.max(2, Math.ceil(window.devicePixelRatio || 1)));
    canvas.width *= scale;
    canvas.height *= scale;
    context.scale(scale, scale);
    return context;
  }

  const field = setupCanvas(board);
  const next = setupCanvas(preview);
  const size = 30;
  const fieldWidth = WIDTH * size;
  const fieldHeight = HEIGHT * size;
  const background = field.createLinearGradient(0, 0, 0, fieldHeight);
  background.addColorStop(0, "#10182b");
  background.addColorStop(1, "#0a101f");

  function roundedRect(ctx, x, y, width, height, radius) {
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + width, y, x + width, y + height, radius);
    ctx.arcTo(x + width, y + height, x, y + height, radius);
    ctx.arcTo(x, y + height, x, y, radius);
    ctx.arcTo(x, y, x + width, y, radius);
    ctx.closePath();
  }

  function tile(ctx, x, y, unit, type, ghost = false) {
    const [face, light, shadow] = palettes[type];
    const gap = unit > 20 ? 1.6 : 1;
    const edge = unit - gap * 2;
    roundedRect(ctx, x + gap, y + gap, edge, edge, unit * 0.14);
    if (ghost) {
      ctx.fillStyle = `${face}20`;
      ctx.strokeStyle = `${face}70`;
      ctx.lineWidth = 1.4;
      ctx.fill();
      ctx.stroke();
      return;
    }
    ctx.fillStyle = shadow;
    ctx.fill();
    roundedRect(ctx, x + gap, y + gap, edge, edge - unit * 0.11, unit * 0.14);
    ctx.fillStyle = face;
    ctx.fill();
    roundedRect(ctx, x + gap + unit * 0.13, y + gap + unit * 0.11, edge - unit * 0.26, unit * 0.065, unit * 0.033);
    ctx.fillStyle = light;
    ctx.fill();
  }

  function pieceOnBoard(piece, y, ghost = false) {
    for (const [dx, dy] of piece.cells) {
      if (y + dy >= 0) tile(field, (piece.x + dx) * size, (y + dy) * size, size, piece.type, ghost);
    }
  }

  function drawBoard() {
    if (mode === "triangle") {
      TriangleView.drawBoard(field, game, state);
      return;
    }
    field.fillStyle = background;
    field.fillRect(0, 0, fieldWidth, fieldHeight);
    field.beginPath();
    for (let x = size; x < fieldWidth; x += size) {
      field.moveTo(x, 0);
      field.lineTo(x, fieldHeight);
    }
    for (let y = size; y < fieldHeight; y += size) {
      field.moveTo(0, y);
      field.lineTo(fieldWidth, y);
    }
    field.strokeStyle = "#a5bdf416";
    field.lineWidth = 0.75;
    field.stroke();

    const cells = state === "ready" ? backdrop : game.board;
    field.globalAlpha = state === "ready" ? 0.52 : 1;
    for (let y = 0; y < HEIGHT; y += 1) {
      for (let x = 0; x < WIDTH; x += 1) {
        const type = cells[y][x];
        if (type && type !== ".") tile(field, x * size, y * size, size, type);
      }
    }
    field.globalAlpha = 1;

    if (game.active && (state === "playing" || state === "paused")) {
      const landing = game.ghostY();
      if (landing > game.active.y) pieceOnBoard(game.active, landing, true);
      pieceOnBoard(game.active, game.active.y);
    }
  }

  function drawPreview() {
    if (mode === "triangle") {
      TriangleView.drawPreview(next, game.next, previewWidth, previewHeight);
      preview.setAttribute("aria-label", `下一个拼片为${TriangleView.names[game.next]}`);
      return;
    }
    next.clearRect(0, 0, previewWidth, previewHeight);
    const cells = PIECES[game.next];
    if (!cells) return;
    const columns = cells.map(([x]) => x);
    const rows = cells.map(([, y]) => y);
    const minY = Math.min(...rows);
    const maxY = Math.max(...rows);
    const unit = Math.min(18, Math.floor((previewHeight - 4) / (maxY - minY + 1)));
    const left = (previewWidth - unit * (Math.max(...columns) + Math.min(...columns) + 1)) / 2;
    const top = (previewHeight - unit * (maxY + minY + 1)) / 2;
    for (const [x, y] of cells) tile(next, left + x * unit, top + y * unit, unit, game.next);
    preview.setAttribute("aria-label", `下一个方块为${pieceLabels[game.next] || ` ${game.next} 形`}`);
  }

  function refreshScores() {
    recordScore();
    $("score").textContent = format.format(game.score);
    $("best-steady").textContent = format.format(best.steady);
    $("best-accelerate").textContent = format.format(best.accelerate);
    $("best-triangle").textContent = format.format(best.triangle);
    if (mode === "triangle") {
      $("level-status").textContent = `三角形 · 已拼满 ${game.lines} 个点`;
    } else {
      $("level-status").textContent = mode === "accelerate"
        ? `渐快 · 等级 ${game.level} · 已消除 ${game.lines} 行`
        : `匀速 · 已消除 ${game.lines} 行`;
    }
  }

  function updateInterface() {
    const playing = state === "playing";
    const paused = state === "paused";
    const ready = state === "ready";
    const ended = state === "ended";
    pauseButton.disabled = !playing && !paused;
    pauseButton.setAttribute("aria-label", paused ? "继续游戏" : "暂停");
    pauseButton.title = paused ? "继续游戏" : "暂停";
    pauseButton.innerHTML = paused
      ? '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="5" width="3.5" height="14" rx="1"/><rect x="13.5" y="5" width="3.5" height="14" rx="1"/></svg>';
    for (const control of controls) control.disabled = !playing;
    for (const button of modes) {
      button.setAttribute("aria-pressed", String(button.dataset.mode === mode));
    }
    const modeDescription = modeDescriptions[mode];
    const isTriangle = mode === "triangle";
    board.setAttribute("aria-label", isTriangle
      ? `${TriangleEngine.WIDTH} 列 ${TriangleEngine.HEIGHT} 行的三角形拼点棋盘`
      : "10 列 20 行的方块棋盘");
    $("mode-help").textContent = playing || paused
      ? modeDescription + "切换模式会结束本局。"
      : modeDescription;
    overlay.hidden = playing;
    resetButton.hidden = !paused;
    $("game-status").textContent = { ready: "等待开始", playing: "游戏中", paused: "已暂停", ended: "本局结束" }[state];

    if (ready) {
      $("overlay-tag").textContent = isTriangle ? "三角形模式" : "俄罗斯方块";
      $("overlay-title").textContent = "准备就绪";
      $("overlay-description").textContent = modeDescription;
      $("action-text").textContent = "开始游戏";
    }
    if (paused) {
      $("overlay-tag").textContent = "休息一下";
      $("overlay-title").textContent = "游戏暂停";
      $("overlay-description").textContent = "准备好后，随时继续本局。";
      $("action-text").textContent = "继续游戏";
    }
    if (ended) {
      $("overlay-tag").textContent = "本局结束";
      $("overlay-title").textContent = `${format.format(game.score)} 分`;
      $("overlay-description").textContent = isTriangle
        ? `共拼满 ${game.lines} 个点。`
        : `共消除 ${game.lines} 行。`;
      $("action-text").textContent = "再玩一局";
    }
    drawBoard();
    drawPreview();
    refreshScores();
  }

  function stopHold() {
    clearTimeout(holdDelay);
    clearInterval(holdRepeat);
  }

  function isFastDrop() {
    return fastPointer !== null || fastKeys.size > 0;
  }

  function stopControls() {
    stopHold();
    fastPointer = null;
    fastKeys.clear();
  }

  function setState(nextState) {
    state = nextState;
    cancelAnimationFrame(animation);
    stopControls();
    lastFrame = 0;
    updateInterface();
    if (state === "playing") animation = requestAnimationFrame(frame);
  }

  function refreshPlay(previous, previousScore) {
    if (game.over) {
      setState("ended");
      return;
    }
    drawBoard();
    if (previous !== game.active) drawPreview();
    if (previous !== game.active || previousScore !== game.score) refreshScores();
  }

  function frame(now) {
    if (state !== "playing") return;
    const previous = game.active;
    const previousScore = game.score;
    const changed = lastFrame && game.tick(Math.min(now - lastFrame, 100), isFastDrop());
    lastFrame = now;
    if (changed) refreshPlay(previous, previousScore);
    if (state === "playing") animation = requestAnimationFrame(frame);
  }

  function perform(action) {
    if (state !== "playing") return;
    const previous = game.active;
    const previousScore = game.score;
    if (action === "left") game.move(-1);
    if (action === "right") game.move(1);
    if (action === "rotate") game.rotate();
    if (action === "drop") game.softDrop();
    refreshPlay(previous, previousScore);
  }

  for (const button of controls) {
    const action = button.dataset.action;
    if (action === "left" || action === "right") {
      button.addEventListener("pointerdown", (event) => {
        if (event.button !== 0 || state !== "playing") return;
        stopHold();
        button.setPointerCapture(event.pointerId);
        perform(action);
        holdDelay = setTimeout(() => {
          perform(action);
          holdRepeat = setInterval(() => perform(action), 55);
        }, 175);
      });
      for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) {
        button.addEventListener(type, stopHold);
      }
      button.addEventListener("click", (event) => {
        if (event.detail === 0) perform(action);
      });
    } else {
      button.addEventListener("pointerdown", (event) => {
        if (event.button !== 0 || state !== "playing") return;
        if (action === "rotate") {
          perform(action);
          return;
        }
        if (fastPointer !== null) return;
        const wasFast = isFastDrop();
        button.setPointerCapture(event.pointerId);
        fastPointer = event.pointerId;
        if (!wasFast) perform(action);
      });
      if (action === "drop") {
        for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) {
          button.addEventListener(type, (event) => {
            if (event.pointerId === fastPointer) fastPointer = null;
          });
        }
      }
      button.addEventListener("click", (event) => {
        if (event.detail === 0) perform(action);
      });
    }
  }

  function chooseMode(nextMode) {
    if (nextMode === mode) return;
    resumeAfterSettings = false;
    mode = nextMode;
    savePreference(modeKey, mode);
    game = newGame();
    setState("ready");
  }

  for (const button of modes) {
    button.addEventListener("click", () => chooseMode(button.dataset.mode));
  }

  const layoutButtons = [...document.querySelectorAll("[data-layout]")];
  function setLayout(layout) {
    const swapped = layout === "swapped";
    document.querySelector(".controls").classList.toggle("swapped", swapped);
    for (const button of layoutButtons) button.setAttribute("aria-pressed", String(button.dataset.layout === (swapped ? "swapped" : "normal")));
    savePreference("fangkuai-arcade.layout", swapped ? "swapped" : "normal");
  }
  layoutButtons.forEach(button => button.addEventListener("click", () => setLayout(button.dataset.layout)));
  setLayout(loadPreference("fangkuai-arcade.layout"));
  let installPrompt = null;
  const installButton = $("install-button");
  const installHelp = $("install-help");
  function installed() {
    return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  }
  function updateInstallButton() {
    installButton.disabled = installed();
    installButton.textContent = installed() ? "已安装应用" : "安装应用";
  }
  window.addEventListener("beforeinstallprompt", event => {
    event.preventDefault();
    installPrompt = event;
  });
  window.addEventListener("appinstalled", () => {
    installPrompt = null;
    installButton.disabled = true;
    installButton.textContent = "已安装应用";
    installHelp.hidden = false;
    installHelp.textContent = "安装成功，可以从主屏幕打开方块街机。";
  });
  installButton.addEventListener("click", async () => {
    if (installPrompt) {
      const prompt = installPrompt;
      installPrompt = null;
      try {
        await prompt.prompt();
        const result = await prompt.userChoice;
        installHelp.textContent = result.outcome === "accepted" ? "正在安装，请查看手机主屏幕。" : "已取消安装，可在浏览器菜单中再次安装。";
      } catch {
        installHelp.textContent = "暂时无法打开安装窗口，请使用浏览器菜单中的安装或添加到主屏幕。";
      }
    } else if (/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) {
      installHelp.textContent = "请在 Safari 中点击分享按钮，然后选择“添加到主屏幕”。";
    } else {
      installHelp.textContent = "请在浏览器菜单中选择“安装应用”或“添加到主屏幕”。如果没有此选项，请稍后刷新页面再试。";
    }
    installHelp.hidden = false;
  });
  updateInstallButton();

  settingsButton.addEventListener("click", () => {
    resumeAfterSettings = state === "playing";
    if (resumeAfterSettings) setState("paused");
    settingsDialog.showModal();
  });
  $("settings-close").addEventListener("click", () => settingsDialog.close());
  $("settings-done").addEventListener("click", () => settingsDialog.close());
  settingsDialog.addEventListener("close", () => {
    if (resumeAfterSettings && !document.hidden) setState("playing");
    resumeAfterSettings = false;
  });

  function togglePause() {
    if (state === "playing") setState("paused");
    else if (state === "paused") setState("playing");
  }

  primaryAction.addEventListener("click", () => {
    if (state === "ended") game = newGame();
    setState("playing");
  });
  pauseButton.addEventListener("click", togglePause);
  resetButton.addEventListener("click", () => {
    game = newGame();
    setState("ready");
    primaryAction.focus();
  });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && state === "playing") setState("paused");
  });
  window.addEventListener("blur", stopControls);

  const keyboard = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "rotate", ArrowDown: "drop", " ": "drop" };
  document.addEventListener("keydown", (event) => {
    if (settingsDialog.open) return;
    if (event.key === "Escape" && !event.repeat) {
      togglePause();
      return;
    }
    const action = keyboard[event.key];
    const focusedButton = event.target.closest?.("button");
    if (state !== "playing" || !action) return;
    if (event.key === " " && focusedButton && focusedButton.dataset.action !== "drop") return;
    event.preventDefault();
    if (action === "drop") {
      if (event.repeat) return;
      const wasFast = isFastDrop();
      fastKeys.add(event.key);
      if (!wasFast) perform(action);
    } else if (!event.repeat || action === "left" || action === "right") {
      perform(action);
    }
  });
  document.addEventListener("keyup", (event) => fastKeys.delete(event.key));

  if (legacyBest > 0) {
    $("legacy-record").hidden = false;
    $("best-legacy").textContent = format.format(legacyBest);
  }
  updateInterface();
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }
})();

</script>
</body>
</html>
